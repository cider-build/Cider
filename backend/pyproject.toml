[project]
name = "backend"
version = "0.1.0"
description = "Cider backend: auth, orgs, and sandbox orchestration across nodes."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "pycryptodome>=3.23.0",
]

[project.scripts]
backend = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
