[project]
name = "node"
version = "0.1.0"
description = "Cider node: runs on a Mac, manages up to two macOS sandbox VMs via ciderctl."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
node = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
